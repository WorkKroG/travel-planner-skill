version: 1
dimensions:
  - id: skeleton_distinctness
    max_score: 4
    anchors: {required: ["scenario missing-pdf-adapter"], evidence: ["PDF adapter unavailable"], forbidden: ["PDF created successfully"]}
  - id: tradeoffs
    max_score: 4
    anchors: {required: ["pdf_adapter_available=False"], evidence: ["html_renderer_available=True"], forbidden: ["silent adapter fallback"]}
  - id: pacing
    max_score: 4
    anchors: {required: ["explicit PDF diagnostics"], evidence: ["local environment evidence"], forbidden: ["retry forever"]}
  - id: backup_usefulness
    max_score: 4
    anchors: {required: ["deterministic HTML output"], evidence: ["retain verified"], forbidden: ["discard HTML"]}
  - id: readability
    max_score: 4
    anchors: {required: ["PDF"], evidence: ["HTML"], forbidden: ["unidentified"]}
  - id: calibrated_uncertainty
    max_score: 4
    anchors: {required: ["not a false success claim"], evidence: ["capability result"], forbidden: ["reported PDF success"]}
