version: 1
dimensions:
  - id: skeleton_distinctness
    max_score: 4
    anchors: {required: ["scenario dst-overnight"], evidence: ["DST overnight rollover"], forbidden: ["ordinary local chronology"]}
  - id: tradeoffs
    max_score: 4
    anchors: {required: ["timezone-aware chronology"], evidence: ["local date boundary"], forbidden: ["ignored DST"]}
  - id: pacing
    max_score: 4
    anchors: {required: ["300 real minutes"], evidence: ["240 wall-clock minutes"], forbidden: ["duration is 240 minutes"]}
  - id: backup_usefulness
    max_score: 4
    anchors: {required: ["scheduled-duration check"], evidence: ["confirming the connection"], forbidden: ["confirm without recheck"]}
  - id: readability
    max_score: 4
    anchors: {required: ["2026-10-24T23:30:00+01:00"], evidence: ["2026-10-25T03:30:00+00:00"], forbidden: ["unidentified"]}
  - id: calibrated_uncertainty
    max_score: 4
    anchors: {required: ["IANA zones Europe/London"], evidence: ["frozen duration 300 minutes"], forbidden: ["timezone unknown"]}
