version: 1
dimensions:
  - id: skeleton_distinctness
    max_score: 4
    anchors: {required: ["scenario booking-timezone"], evidence: ["booking timezone mismatch"], forbidden: ["booking timezone aligned"]}
  - id: tradeoffs
    max_score: 4
    anchors: {required: ["provider clock"], evidence: ["traveller proposal"], forbidden: ["used the wrong timezone"]}
  - id: pacing
    max_score: 4
    anchors: {required: ["release instant"], evidence: ["2026-11-30T15:00:00+00:00"], forbidden: ["traveller clock controls"]}
  - id: backup_usefulness
    max_score: 4
    anchors: {required: ["booking reminder"], evidence: ["2026-11-30T15:00:00+00:00"], forbidden: ["no reminder"]}
  - id: readability
    max_score: 4
    anchors: {required: ["provider-local"], evidence: ["Asia/Tokyo"], forbidden: ["unidentified"]}
  - id: calibrated_uncertainty
    max_score: 4
    anchors: {required: ["frozen official release timestamp"], evidence: ["no live availability claim"], forbidden: ["invented live availability"]}
