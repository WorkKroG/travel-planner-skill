version: 1
dimensions:
  - id: skeleton_distinctness
    max_score: 4
    anchors: {required: ["scenario local-weather-swap"], evidence: ["local weather swap for day-4"], forbidden: ["whole itinerary rewrite"]}
  - id: tradeoffs
    max_score: 4
    anchors: {required: ["condition rain"], evidence: ["targets ['day:day-4', 'outputs:all']"], forbidden: ["clear weather"]}
  - id: pacing
    max_score: 4
    anchors: {required: ["use backup museum only on day-4"], evidence: ["production analyze_change"], forbidden: ["mutate day-5"]}
  - id: backup_usefulness
    max_score: 4
    anchors: {required: ["backup museum"], evidence: ["preserve day-5"], forbidden: ["no backup"]}
  - id: readability
    max_score: 4
    anchors: {required: ["day-4"], evidence: ["day-5"], forbidden: ["unidentified"]}
  - id: calibrated_uncertainty
    max_score: 4
    anchors: {required: ["frozen weather observation"], evidence: ["not a live forecast"], forbidden: ["live forecast verified"]}
