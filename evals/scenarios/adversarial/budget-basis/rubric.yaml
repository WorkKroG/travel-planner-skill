version: 1
review_mode: online-required
dimensions:
  - id: skeleton_distinctness
    max_score: 4
    criterion: Alternatives are meaningfully distinct when the trip warrants alternatives.
  - id: tradeoffs
    max_score: 4
    criterion: Meaningful route tradeoffs are identified and explained.
  - id: pacing
    max_score: 4
    criterion: The itinerary has realistic pacing and daily load.
  - id: backup_usefulness
    max_score: 4
    criterion: Backups are useful, local, and preserve the route where possible.
  - id: readability
    max_score: 4
    criterion: The result is clear, structured, and usable during the trip.
  - id: calibrated_uncertainty
    max_score: 4
    criterion: Assumptions and unverified facts are labeled honestly.
