version: 1
dimensions:
  - id: skeleton_distinctness
    max_score: 4
    anchors: {required: ["scenario weekend-city-break"], evidence: ["composite travel-plan challenge"], forbidden: ["three itinerary skeletons"]}
  - id: tradeoffs
    max_score: 4
    anchors: {required: ["2-day low trip"], evidence: ["recommends 1 skeleton"], forbidden: ["high complexity trip"]}
  - id: pacing
    max_score: 4
    anchors: {required: ["museum arrival 2026-09-12T16:30:00+02:00"], evidence: ["cutoff 2026-09-12T16:00:00+02:00"], forbidden: ["museum admission feasible"]}
  - id: backup_usefulness
    max_score: 4
    anchors: {required: ["retain local backups"], evidence: ["confirmed bases or lodging"], forbidden: ["no local backup"]}
  - id: readability
    max_score: 4
    anchors: {required: ["apply each computed hard constraint"], evidence: ["without hidden route edits"], forbidden: ["unidentified"]}
  - id: calibrated_uncertainty
    max_score: 4
    anchors: {required: ["frozen fixture evidence"], evidence: ["timings, authority states, and availability"], forbidden: ["live availability verified"]}
