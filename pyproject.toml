[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-travel-planner"
version = "0.1.0"
description = "Deterministic helpers for the Travel Planner Codex skill."
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "Jinja2>=3.1,<4",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.54,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
travel-planner = "travel_planner.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/travel-planner/scripts"}

[tool.setuptools.packages.find]
where = ["skills/travel-planner/scripts"]

[tool.setuptools.data-files]
"share/codex-travel-planner/schemas" = ["skills/travel-planner/schemas/*.json"]
"share/codex-travel-planner/trip-template" = ["skills/travel-planner/assets/trip-template/*"]
"share/codex-travel-planner/map-policy" = ["skills/travel-planner/assets/map-provider-policy.yaml"]
"share/codex-travel-planner/html" = ["skills/travel-planner/assets/html/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py311"
line-length = 100
