claims:
  - id: claim-departure-user-report
    topic: Время вылета из HND
    status: reported
    source_ids: []
    value: По предоставленному пользователем плану вылет из HND 13 ноября 2026 в 15:40; независимо не проверено. Номер рейса, терминал и статус оплаты неизвестны.
  - id: claim-japan-visa-rule-scope
    topic: Применимость безвизового въезда
    status: verified
    source_ids: [source-japan-visa-exemptions]
    freshness_status: fresh
    value: На прочитанной 9 сентября странице МИД Японии условия безвизового въезда зависят от гражданства и характеристик паспорта. Применимость к четырём участникам не установлена; условия на ноябрь требуют повторной проверки.
  - id: claim-japan-natural-hazard-guidance
    topic: Официальные предупреждения о природных рисках
    status: verified
    source_ids: [source-jnto-emergencies, source-fcdo-japan-safety]
    freshness_status: fresh
    value: Прочитанные 9 сентября официальные рекомендации требуют следить за местными предупреждениями о землетрясениях, цунами и вулканической активности. Это общее требование подготовки, а не подтверждение состояния троп или безопасности маршрута 2–13 ноября.
