items:
  - id: ryuo-gorge-hike
    name: Хайкинг по ущелью Рюокё
    geography: {country_code: JP, locality: Nikko}
    discovery_layers: [nature_active]
    claims:
      - {id: claim-ryuo-route, topic: маршрут и доступ, status: unverified, freshness_status: unknown, source_ids: [source-ryuo, source-tobu-express]}
    popularity_signals: []
    assessments: [{dimension: trip_value, value: high, rationale: активный переход к базе Никко без смены выбранного региона}]
    verdict: {status: selected, rationale: основной план 3 ноября с коротким и культурным сценариями}
  - id: chuzenji-packrafting
    name: Треккинг и packrafting на озере Тюдзэндзи
    geography: {country_code: JP, locality: Nikko}
    discovery_layers: [nature_active, hidden_gem]
    claims:
      - {id: claim-packrafting-slot, topic: слот, экипировка и условия отмены, status: unverified, freshness_status: unknown, source_ids: [source-packrafting]}
    popularity_signals: []
    assessments: [{dimension: trip_value, value: high, rationale: выбранная необычная активность 4 ноября}]
    verdict: {status: selected, rationale: выбран пользователем; требует бронирования и погодной проверки}
  - id: izu-craft-choice
    name: Ремесленная мастерская на Идзу
    geography: {country_code: JP, locality: Ito}
    discovery_layers: [cultural, hidden_gem]
    claims:
      - {id: claim-izu-craft-logistics, topic: длительность и доставка изделия, status: unverified, freshness_status: unknown, source_ids: [source-izu-craft, source-hachimano]}
    popularity_signals: []
    assessments: [{dimension: trip_value, value: high, rationale: сохраняет ремесленный фокус насыщенного дня 6 ноября}]
    verdict: {status: shortlisted, rationale: выбрать стекло или керамику, но не обе в основном плане}
  - id: hakone-weather-day
    name: Погодные сценарии Хаконэ
    geography: {country_code: JP, locality: Hakone}
    discovery_layers: [nature_active, cultural]
    claims:
      - {id: claim-hakone-operations, topic: транспорт, тропы, ropeway и газовые ограничения, status: unverified, freshness_status: unknown, source_ids: [source-hakone-nav, source-kintoki, source-owakudani, source-pola]}
    popularity_signals: []
    assessments: [{dimension: resilience, value: high, rationale: три полных сценария под ясную, ветреную и дождевую погоду}]
    verdict: {status: selected, rationale: Mt Kintoki основной при ясной погоде; сценарий выбирается утром}
  - id: kawaguchiko-ebike
    name: Кавагутико на e-bike
    geography: {country_code: JP, locality: Fujikawaguchiko}
    discovery_layers: [nature_active]
    claims:
      - {id: claim-ebike-availability, topic: наличие четырёх велосипедов и условия возврата, status: unverified, freshness_status: unknown, source_ids: [source-kawaguchiko-cycling, source-momiji-festival]}
    popularity_signals: []
    assessments: [{dimension: trip_value, value: high, rationale: связывает северный берег и вечернюю подсветку 8 ноября}]
    verdict: {status: selected, rationale: требует бронирования и погодного плана B}
  - id: ryugatake-hike
    name: Mt Ryūgatake
    geography: {country_code: JP, locality: Lake Motosu}
    discovery_layers: [nature_active]
    claims:
      - {id: claim-ryugatake-conditions, topic: маршрут, погода и транспорт к старту, status: unverified, freshness_status: unknown, source_ids: [source-ryugatake, source-fujikyu-bus]}
    popularity_signals: []
    assessments: [{dimension: trip_value, value: high, rationale: главное ясное утро в районе Фудзи}]
    verdict: {status: selected, rationale: ставится на 9 или 10 ноября по фактической видимости и состоянию тропы}
  - id: tokyo-nov-11-choice
    name: G-Cans, JAL Sky Museum или urban kayak
    geography: {country_code: JP, locality: Tokyo}
    discovery_layers: [hidden_gem, cultural]
    claims:
      - {id: claim-tokyo-bookable-access, topic: доступ, бронирование и ограничения, status: unverified, freshness_status: unknown, source_ids: [source-gcans, source-jal-sky, source-urban-kayak, source-edo-tokyo]}
    popularity_signals: []
    assessments: [{dimension: decision_need, value: high, rationale: варианты несовместимы по времени и требуют отдельного бронирования}]
    verdict: {status: shortlisted, rationale: G-Cans оставлен основным только как рабочий вариант}
  - id: toyosu-edo-day
    name: Toyosu Market, Edo-Tokyo Museum и Edo Kiriko
    geography: {country_code: JP, locality: Tokyo}
    discovery_layers: [cultural, hidden_gem]
    claims:
      - {id: claim-toyosu-edo-access, topic: календарь рынка, торги и мастерская, status: unverified, freshness_status: unknown, source_ids: [source-toyosu-auctions, source-toyosu-calendar, source-edo-kiriko, source-edo-tokyo]}
    popularity_signals: []
    assessments: [{dimension: trip_value, value: high, rationale: выбранный каркас финального полного дня в Токио}]
    verdict: {status: selected, rationale: ранний старт допускает сокращённый сценарий без подъёма в 05:00}
