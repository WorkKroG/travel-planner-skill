title: Япония в движении — 2–13 ноября 2026
trip_thesis: 12 дней между ущельями Никко, вулканическим побережьем Идзу, Хаконэ, Фудзи и двумя полноценными днями в Токио. Время в программе — плановые ориентиры исходного маршрута; отдельно отмечено заявленное время вылета. Все часы местные для Японии.
travel_dates: {start: "2026-11-02", end: "2026-11-13"}
travelers:
  - {id: traveler-a}
  - {id: traveler-b}
  - {id: traveler-c}
  - {id: traveler-d}
priorities:
  - активная природа и осенние пейзажи
  - необычные ремесленные и инфраструктурные активности
  - гибкость маршрута по погоде без смены забронированных баз
  - два полноценных дня в Токио перед вылетом
hard_constraints:
  - сохранить ночёвки в Токио, Никко, Идзу-Когэн, Сэнгокухаре и Кавагутико
  - 4 ноября оставить прогулку у Тюдзэндзи, packrafting и обе мемориальные виллы основным планом
  - 6 ноября совместить Омуро, одну мастерскую и сокращённый участок побережья
  - 13 ноября вылет из Haneda в 15:40; ничто не должно сдвигать выезд в аэропорт
soft_preferences:
  - использовать ясное утро 9 или 10 ноября для горного маршрута у Фудзи
  - при ветре не рассчитывать на lift, ropeway и водные активности
  - держать еду в целевом диапазоне ¥2 000–5 000, кроме одного премиального yuba-kaiseki
assumptions:
  - аэропорт прилёта 2 ноября и район первого токийского отеля ещё не указаны
  - расписания поездов и автобусов в исходном плане ориентировочные и требуют перепроверки
  - базовые расписания, цены и длительности перенесены из пользовательского HTML от 28 августа 2026 и не подтверждены заново; частичная проверка официальной информации по безопасности и въезду записана отдельно в подготовке
  - плановые окна не подтверждают бронь или оплату; фактические бронирования, адреса отелей и суммы оплаты в сохранённых вводных не указаны
map_provider: google
document_language: ru
budget:
  currency: JPY
  note: В исходнике рассчитана только еда за 3–10 ноября; полного бюджета поездки нет.
