schema_version: 1
trip_id: japan-02-13-nov-2026
items:
  - id: review-destination-safety
    title: Обстановка и безопасность
    category: emergency
    status: action_needed
    check_result: "Частичная проверка 9 сентября: прочитаны JNTO и FCDO. Для Никко, побережья Идзу, Хаконэ и Фудзи существенны местные предупреждения, состояние троп, землетрясения, цунами и вулканическая активность; при закрытии объекта использовать сохранённый запасной сценарий. FCDO также отмечает изменчивость региональной напряжённости; следовать указаниям японских властей. Оперативная страница JNTO не загрузилась, перечень ВОЗ не дал доступной выборки по Японии. Эпидемиологическая обстановка, транзит и консульские рекомендации для участников не установлены; безопасность ноября не подтверждена."
    checked_at: "2026-09-09T17:56:50+00:00"
    next_action: Уточнить страны транзита и применимое консульство; завершить проверку оперативных предупреждений о конфликтах, волнениях, эпидемиях, границах и транспорте. Перед природными днями сверить местные ограничения и работу операторов; записать последствия и необходимые изменения.
    recheck_note: Перепроверить перед бронированиями и выездом, при изменении маршрута или обстановки; учитывать более ранние сроки из официальных предупреждений. План не обновляется автоматически.
    source_ids: [source-jnto-emergencies, source-fcdo-japan-safety, source-who-outbreaks]
    claim_ids: [claim-japan-natural-hazard-guidance]
  - id: review-entry-transit
    title: Визы, въезд и транзит
    category: entry
    status: action_needed
    check_result: "Частичная проверка 9 сентября: прочитаны визовая страница МИД Японии и условия безвизового въезда, зависящие от гражданства и паспорта; порядок подачи также зависит от места проживания. В брифе этих сведений и международных пересадок нет. Право въезда и необходимость визы для каждого из четырёх участников пока не установлены."
    checked_at: "2026-09-09T17:56:50+00:00"
    next_action: Уточнить необходимые сведения каждого участника без номеров и копий паспортов, цель поездки и пересадки. Проверить применимые правила Японии и стран транзита, сроки действия документов и подачи заявлений по официальным источникам.
    recheck_note: Перепроверить перед покупкой билетов, подачей на визу и выездом, а также при изменении документов, пересадок или правил. План не обновляется автоматически.
    source_ids: [source-japan-visa, source-japan-visa-exemptions]
    claim_ids: [claim-japan-visa-rule-scope]
  - id: confirm-arrival-airport
